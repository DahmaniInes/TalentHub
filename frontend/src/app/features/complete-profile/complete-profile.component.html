<div class="cp-root">

  <!-- ══ TOPBAR ══ -->
  <header class="cp-topbar">
    <div class="cp-logo">
      <img src="assets/images/Logo.png" alt="TalentHub" class="cp-logo-img"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <div class="cp-logo-fallback" style="display:none">T</div>
      <span class="cp-logo-text">TalentHub</span>
    </div>
    <div class="cp-topbar-actions">
      <button class="cp-icon-btn" (click)="toggleTheme()" [title]="isDark ? 'Mode clair' : 'Mode sombre'">
        <svg *ngIf="!isDark" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg *ngIf="isDark" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="cp-btn-skip" (click)="skip()">
        Passer
        <svg viewBox="0 0 16 16" fill="none" style="width:13px;height:13px">
          <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ══ CONTENU PRINCIPAL ══ -->
  <main class="cp-main">

    <!-- Avatar + Titre -->
    <div class="cp-hero">
      <label class="cp-avatar-wrap" title="Changer la photo">
        <div class="cp-avatar" *ngIf="!previewUrl()">{{ userInitials }}</div>
        <img *ngIf="previewUrl()" [src]="previewUrl()" class="cp-avatar-img" alt="Photo">
        <div class="cp-avatar-overlay">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M13 3H7L6 5H3a1 1 0 00-1 1v10a1 1 0 001 1h14a1 1 0 001-1V6a1 1 0 00-1-1h-3L13 3z"
                  stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </div>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" class="sr-only">
      </label>
      <h1 class="cp-title">Complétez votre profil</h1>
      <p class="cp-subtitle">Ces informations sont optionnelles et modifiables à tout moment.</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="cp-form">

      <!-- Ligne 1 : dates -->
      <div class="cp-row">
        <div class="cp-field">
          <label class="cp-label">Date de naissance</label>
          <div class="cp-input-wrap" [class.focused]="dateNaissanceFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <rect x="1" y="2" width="14" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M1 7h14M4.5 1v2.5M11.5 1v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <input type="date" formControlName="dateNaissance" class="cp-input"
                   (focus)="dateNaissanceFocused=true" (blur)="dateNaissanceFocused=false">
          </div>
        </div>
        <div class="cp-field">
          <label class="cp-label">Date de fin de contrat</label>
          <div class="cp-input-wrap" [class.focused]="dateFinFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <rect x="1" y="2" width="14" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M1 7h14M4.5 1v2.5M11.5 1v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <input type="date" formControlName="dateFinContrat" class="cp-input"
                   (focus)="dateFinFocused=true" (blur)="dateFinFocused=false">
          </div>
        </div>
      </div>

      <!-- Ligne 2 : téléphone + poste -->
      <div class="cp-row">
        <div class="cp-field">
          <label class="cp-label">Téléphone</label>
          <div class="cp-input-wrap" [class.focused]="telFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <path d="M3 2h2.5l1 3-1.5 1.5a9 9 0 003.5 3.5L10 8.5l3 1V12a1 1 0 01-1 1C5.16 13 2 9.84 2 3a1 1 0 011-1z"
                    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
            <input type="tel" formControlName="telephone" placeholder="71 234 567" class="cp-input"
                   (focus)="telFocused=true" (blur)="telFocused=false">
          </div>
        </div>
        <div class="cp-field">
          <label class="cp-label">Poste</label>
          <div class="cp-input-wrap" [class.focused]="posteFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <rect x="1" y="6" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M5.5 6V4.5a2 2 0 013 0V6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <input type="text" formControlName="poste" placeholder="Développeur, RH..." class="cp-input"
                   (focus)="posteFocused=true" (blur)="posteFocused=false">
          </div>
        </div>
      </div>

      <!-- Ligne 3 : département + photo -->
      <div class="cp-row">
        <div class="cp-field">
          <label class="cp-label">Département</label>
          <div class="cp-input-wrap" [class.focused]="deptFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M1 7h14M5.5 2v12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            <input type="text" formControlName="departement" placeholder="Informatique, RH..." class="cp-input"
                   (focus)="deptFocused=true" (blur)="deptFocused=false">
          </div>
        </div>
        <div class="cp-field">
          <label class="cp-label">Photo de profil</label>
          <label class="cp-upload-btn">
            <svg viewBox="0 0 16 16" fill="none" class="cp-ico">
              <path d="M8 3v8M5 6l3-3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            {{ selectedFile ? selectedFile.name : 'Choisir une image' }}
            <input type="file" accept="image/*" (change)="onFileSelected($event)" class="sr-only">
          </label>
        </div>
      </div>

      <!-- Adresse pleine largeur -->
      <div class="cp-field cp-field-full">
        <label class="cp-label">Adresse</label>
        <div class="cp-input-wrap cp-textarea-wrap" [class.focused]="adresseFocused">
          <svg class="cp-ico" viewBox="0 0 16 16" fill="none" style="align-self:flex-start;margin-top:3px">
            <path d="M8 1C5.24 1 3 3.24 3 6c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5z" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.2"/>
          </svg>
          <textarea formControlName="adresse" rows="2" placeholder="Adresse complète" class="cp-input cp-textarea"
                    (focus)="adresseFocused=true" (blur)="adresseFocused=false"></textarea>
        </div>
      </div>

      <!-- ══ SÉPARATEUR ACADÉMIQUE ══ -->
      <div style="border-top:1px solid var(--border-color);padding-top:18px;margin-top:4px">
        <p style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin:0 0 14px">
          Informations académiques
        </p>
      </div>

      <!-- ✅ Ligne : Université + Spécialité — selects depuis nomenclature -->
      <div class="cp-row">
        <div class="cp-field">
          <label class="cp-label">Université</label>
          <div class="cp-input-wrap" [class.focused]="universiteFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <path d="M8 1l7 3.5v4c0 3.5-3 5.5-7 6.5-4-1-7-3-7-6.5V4.5L8 1z"
                    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
            <!-- ✅ select avec universiteId depuis nomenclature -->
            <select formControlName="universiteId" class="cp-input" style="cursor:pointer"
                    (focus)="universiteFocused=true" (blur)="universiteFocused=false">
              <option [ngValue]="null">— Sélectionner —</option>
              <option *ngFor="let u of universites()" [ngValue]="u.id">{{ u.libelle }}</option>
            </select>
          </div>
        </div>
        <div class="cp-field">
          <label class="cp-label">Spécialité</label>
          <div class="cp-input-wrap" [class.focused]="specialiteFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <path d="M9 3H5a2 2 0 00-2 2v6a2 2 0 002 2h6a2 2 0 002-2V7"
                    stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M14 2l-5 5M9 2h5v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <!-- ✅ select avec specialiteId depuis nomenclature -->
            <select formControlName="specialiteId" class="cp-input" style="cursor:pointer"
                    (focus)="specialiteFocused=true" (blur)="specialiteFocused=false">
              <option [ngValue]="null">— Sélectionner —</option>
              <option *ngFor="let s of specialites()" [ngValue]="s.id">{{ s.libelle }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ✅ Niveau d'étude — select depuis nomenclature -->
      <div class="cp-field cp-field-full">
        <label class="cp-label">Niveau d'étude</label>
        <div class="cp-input-wrap" [class.focused]="niveauEtudeFocused">
          <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
            <path d="M8 1l7 3.5-7 3.5-7-3.5L8 1zM1.5 8.5L8 12l6.5-3.5"
                  stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
          <select formControlName="niveauEtudeId" class="cp-input" style="cursor:pointer"
                  (focus)="niveauEtudeFocused=true" (blur)="niveauEtudeFocused=false">
            <option [ngValue]="null">— Sélectionner —</option>
            <option *ngFor="let n of niveaux()" [ngValue]="n.id">{{ n.libelle }}</option>
          </select>
        </div>
      </div>

      <!-- ══ CHAMPS STAGE — uniquement si stagiaire ══ -->
      <ng-container *ngIf="estStagiaire">

        <div style="border-top:1px solid var(--border-color);padding-top:18px;margin-top:4px">
          <p style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:0 0 14px;display:flex;align-items:center;gap:6px">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" style="width:12px;height:12px">
              <path d="M7 1l6 3v3c0 3-2.5 5-6 5.5C4.5 12 1 10 1 7V4L7 1z" stroke-linejoin="round"/>
            </svg>
            Informations du stage
          </p>
        </div>

        <!-- Type de stage -->
        <div class="cp-field cp-field-full">
          <label class="cp-label">Type de stage</label>
          <div class="cp-input-wrap">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <path d="M7 7h.01M7 3h4c.45 0 .9.17 1.24.51l4 4a2 2 0 010 2.83l-4 4a1.75 1.75 0 01-2.48 0l-4-4A1.75 1.75 0 015 9V7a4 4 0 012-3.46"
                    stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <select formControlName="typeStageId" class="cp-input" style="cursor:pointer">
              <option [ngValue]="null">— Sélectionner —</option>
              <option *ngFor="let t of typesStage()" [ngValue]="t.id">{{ t.libelle }}</option>
            </select>
          </div>
        </div>

        <!-- Dates stage -->
        <div class="cp-row">
          <div class="cp-field">
            <label class="cp-label">Date début stage</label>
            <div class="cp-input-wrap" [class.focused]="dateDebutStageFocused">
              <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="2" width="14" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M1 7h14M4.5 1v2.5M11.5 1v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              <input type="date" formControlName="dateDebutStage" class="cp-input"
                     (focus)="dateDebutStageFocused=true" (blur)="dateDebutStageFocused=false">
            </div>
          </div>
          <div class="cp-field">
            <label class="cp-label">Date fin stage</label>
            <div class="cp-input-wrap" [class.focused]="dateFinStageFocused">
              <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="2" width="14" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M1 7h14M4.5 1v2.5M11.5 1v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <path d="M5 10l2 2 4-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <input type="date" formControlName="dateFinStage" class="cp-input"
                     (focus)="dateFinStageFocused=true" (blur)="dateFinStageFocused=false">
            </div>
          </div>
        </div>

        <!-- Date soutenance -->
        <div class="cp-field cp-field-full">
          <label class="cp-label">Date de soutenance</label>
          <div class="cp-input-wrap" [class.focused]="dateSoutenanceFocused">
            <svg class="cp-ico" viewBox="0 0 16 16" fill="none">
              <rect x="1" y="2" width="14" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M1 7h14M4.5 1v2.5M11.5 1v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <circle cx="8" cy="10.5" r="1.5" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            <input type="date" formControlName="dateSoutenance" class="cp-input"
                   (focus)="dateSoutenanceFocused=true" (blur)="dateSoutenanceFocused=false">
          </div>
        </div>

      </ng-container>
      <!-- ══ FIN CHAMPS STAGE ══ -->

      <!-- Messages -->
      <div *ngIf="errorMsg()" class="cp-alert cp-alert-error">⚠️ {{ errorMsg() }}</div>
      <div *ngIf="success()" class="cp-alert cp-alert-success">✅ Profil mis à jour ! Redirection...</div>

      <!-- Bouton enregistrer -->
      <button type="submit" class="cp-btn-save" [disabled]="loading()">
        <div *ngIf="loading()" class="cp-spinner"></div>
        <svg *ngIf="!loading()" viewBox="0 0 16 16" fill="none" style="width:15px;height:15px">
          <path d="M13 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8l3-3V3a1 1 0 00-1-1zM5 8h6M5 11h4"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        {{ loading() ? 'Enregistrement...' : 'Enregistrer mon profil' }}
      </button>

    </form>
  </main>

  <footer class="cp-footer">
    © TalentHub 2026 — Tous droits réservés
  </footer>

</div>
