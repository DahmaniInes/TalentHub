apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-service
  namespace: talenthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: application-service
  template:
    metadata:
      labels:
        app: application-service
    spec:
      containers:
        - name: application-service
          image: talenthubines2026.azurecr.io/application-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/application_db
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: http://keycloak:8080
---
apiVersion: v1
kind: Service
metadata:
  name: application-service
  namespace: talenthub
spec:
  selector:
    app: application-service
  ports:
    - port: 8081
      targetPort: 8081